# Publica Atril en GitHub Pages cada vez que se sube algo a main, si las pruebas pasan.
# Requisito (una vez): Settings → Pages → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Guardar el informe si fallan
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-de-pruebas
          path: test-results/
          retention-days: 7

  publicar:
    needs: pruebas
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Armar el sitio (solo lo que usa la app)
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png CREDITS.md fonts vendor snd ejemplos _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
