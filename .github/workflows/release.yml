# Compila los instaladores de Windows y los deja en un borrador de Release de GitHub.
# Se activa al subir una etiqueta de versión que calce con package.json, por ejemplo:
#   (subir "version" en package.json a 0.2.0, commit)  git tag v0.2.0  y  git push origin v0.2.0
# El borrador queda en github.com/<usuario>/Atril/releases: revisarlo y pulsar "Publish release".
name: Instaladores de Windows

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: La etiqueta calza con la versión de package.json
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::La etiqueta es $GITHUB_REF_NAME pero package.json dice $v. Sube la versión en package.json y vuelve a etiquetar."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npx playwright install chromium

      - name: Pruebas web
        run: npm test

      - name: Compilar instaladores (.exe y .msi)
        run: npx tauri build

      # Informativas: en los servidores de GitHub WebView2 no abre su puerto de depuración (la app arranca pero
      # Playwright no puede conectarse). Las que valen se corren en Windows antes de etiquetar: npm run test:escritorio
      - name: Pruebas de escritorio sobre la app final (informativas)
        continue-on-error: true
        shell: bash
        run: ATRIL_EXE="$PWD/src-tauri/target/release/atril.exe" npx playwright test -c playwright.escritorio.config.mjs --max-failures=1

      - name: Guardar el informe si fallan
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-de-pruebas
          path: test-results/
          retention-days: 7

      - name: Borrador de Release con los instaladores
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: Atril ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **Windows:** descarga `Atril_…_x64-setup.exe` (recomendado, no pide permiso de administrador) o el `.msi`.
            Windows SmartScreen puede avisar porque el instalador no está firmado: «Más información» → «Ejecutar de todas formas».
            También puedes usar Atril sin instalar en https://imboqqentt.github.io/Atril/
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
