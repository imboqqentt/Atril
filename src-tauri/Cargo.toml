[package]
name = "atril"
version = "0.2.3"
description = "Atril, editor de partituras"
authors = ["Daniel Hormazábal"]
edition = "2021"

[lib]
name = "atril_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
percent-encoding = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
